[package]
name = "rust-skgen"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Generate and update AI agent skills from public documentation."
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5.32", features = ["derive"] }
reqwest = { version = "0.12.12", default-features = false, features = ["blocking", "rustls-tls"] }
scraper = "0.24.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
url = "2.5.4"
